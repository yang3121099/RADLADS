model:
  ctx_len: 4096

train:
  proj_suffix: 5_continue
  train_stage: 3
  load_partial: 0

  data_type: "binidx"
  data_file: "data/CHIMERA"
  my_exit_tokens: 200000000

  # magic_prime 需要匹配数据集和 ctx_len，以下是预计算值:
  #   CHIMERA   ctx_len=4096 -> magic_prime = 53939
  #   OpenR1    ctx_len=4096 -> 需要重新用 prepare_reasoning_data.py 计算
  magic_prime: 53939

  optimizer: dsfusedadamw
  lr_decay_type: cos
  lr_init: 5e-6
  lr_final: 1e-6
  warmup_steps: 50
  beta1: 0.9
  beta2: 0.95
  adam_eps: 1e-8
  weight_decay: 0

  devices: 2
  num_nodes: 1
  micro_bsz: 1
  accumulate_grad_batches: 16
  strategy: deepspeed_stage_1
  grad_cp: 1
  ds_bucket_mb: 200

  epoch_save: 1
  # 2 devices * micro_bsz 1 * accum 16 = global_step_bsz 32
  # tokens/step = 4096 * 32 = 131072
  # 20M / 131072 ≈ 152 steps
  save_every_n_steps: 150
